name: Jim
run-name: Bimbo

on: workflow_dispatch

jobs:
  job1:
    name: Creaza un artifact
    runs-on: ubuntu-latest
    steps:
      - name: Creeaza fisierul
        run: echo "Hello World" > hello_world.txt
      - name: Incarca artifactul
        uses: actions/upload-artifact@v4
        with:
          name: hello_world
          path: hello_world.txt
  job2:
    name: Descarca si afiseaza artifactul
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Descarca artifactul
        uses: actions/download-artifact@v4
        with:
          name: hello_world
      - name: Afiseaza continutul fisierului
        run: cat hello_world.txt
