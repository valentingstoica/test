name: This is the name of the workflow. Call it Jim.
run-name: This is the name of the run. Call it Bimbo.

on: workflow_dispatch

env:
  workflow_variable: Workflow variable

jobs:
  job_id1:
    name: This is the name of the job. Call it Brad.
    runs-on: ubuntu-latest

    env:
      job_variable: Job variable

    steps:
      - name: Show github context
        env:
          step_variable: Step variabl
        run: |
          echo "workflow_variable: ${{env.workflow_variable}}"
          echo "job_variable: ${{env.job_variable}}"
          echo "step_variable: ${{env.step_variable}}"
